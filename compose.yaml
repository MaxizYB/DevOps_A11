services:
  buildchecker:
    image: e4-buildchecker:${STUDENT_ID:?set STUDENT_ID to your student number}
    build:
      context: .
      dockerfile: services/buildchecker/Dockerfile
    working_dir: /app
    user: "10001:10001"
    network_mode: none
    cpus: 2
    mem_limit: 1g
    pids_limit: 256
    cap_add:
      - SYS_PTRACE
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m
    volumes:
      - ./work:/app/work
