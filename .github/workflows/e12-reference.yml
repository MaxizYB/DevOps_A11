name: E12 reference replay (no peer attestation)
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  reference:
    name: e11e12-reference-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set CI identity and build
        run: |
          git config --local user.name 999999999
          git config --local user.email ci@example.invalid
          python3 run_e11e12.py build
      - name: Prepare pinned reference fixture
        run: python3 run_e11e12.py prepare --python-image python:3.13-slim@sha256:f82c96458eedc847b233e582eb31336f4954b39cae020b6dcf5b3ed0e5cbcd74
      - name: Replay fixed-MD adapter and five-stage reference
        run: |
          python3 run_e11e12.py run --request data/integration-sample/e11-b.json --out work/reference-e11-b
          python3 run_e11e12.py run --request data/integration-sample/e12.json --out work/reference-e12
      - name: Record a real local API exchange
        shell: bash
        run: |
          mkdir -p work
          python3 run_e11e12.py serve >work/reference-api-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/health && break
            sleep 1
          done
          python3 scripts/e11e12/api_client.py --request data/integration-sample/e12.json --key ci-reference --out work/reference-api
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: e12-reference-evidence-${{ github.run_id }}
          path: work/
          retention-days: 14
